name: Refresh profile dashboard
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/profile_dashboard.py
      - .github/workflows/profile-dashboard.yml
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh genuine GitHub stats and calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: Hamza-Muhammadi
        run: python3 scripts/profile_dashboard.py
      - name: Save updated panels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*-v3.svg data/profile-dashboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh profile dashboard from GitHub data'
          git push
