<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img"><title>Developer notes: clear interfaces, connected data and simpler workflows.</title><defs></defs><rect x="0" y="0" width="1200" height="240" rx="20" fill="#0d0d15" stroke="#33283d"/><rect x="0" y="0" width="7" height="240" rx="3" fill="#761c43"/><text x="37" y="48" fill="#e7a1bf" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" letter-spacing="2">01 / DEVELOPER NOTES</text><text x="116" y="104" fill="#f6eef3" font-family="monospace" font-size="29" font-weight="500" letter-spacing="0">&gt; software that earns its place in the day-to-day.</text><text x="116" y="151" fill="#b5a7b9" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" letter-spacing="0">Interfaces that make sense. Data that stays connected.</text><text x="116" y="192" fill="#b5a7b9" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" letter-spacing="0">Workflows that turn repeat work into a simpler process.</text><text x="37" y="111" fill="#88d9ca" font-family="monospace" font-size="24" font-weight="400" letter-spacing="0">~/h</text></svg>